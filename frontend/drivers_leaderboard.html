<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Drivers Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
<header>
  <h1>Drivers Leaderboard</h1>
</header>
<main>
  <!-- Top nav / controls -->
  <div class="card">
    <div class="row" style="justify-content: space-between; gap: 10px; flex-wrap: wrap;">
      <div class="row" style="gap:8px; flex-wrap: wrap;">
        <a class="badge" href="./drivers.html">← Watchlist</a>
        <a class="badge" href="./index.html">← Heats Browser</a>
        <!-- Optional refresh; remove if you don't want it -->
        <a id="refreshBtn" class="badge" href="#">↻ Refresh</a>
      </div>
      <div class="row" style="gap:8px; flex-wrap: wrap;">
        <label class="small">Filter (contains): <input id="filterInput" placeholder="type to filter names…"/></label>
        <label class="small">Heat Type:
          <select id="heatTypeSelect">
            <option value="All" selected>All</option>
            <option value="Arrive and Drive">Arrive and Drive</option>
            <option value="Endurance">Endurance</option>
            <option value="League">League</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="card">
    <div class="row" style="justify-content: space-between; gap: 10px; flex-wrap: wrap;">
      <div class="small">Updated: <span id="updated" class="mono"></span></div>
      <div class="small">Drivers in watchlist: <span id="watchCount" class="mono">0</span> • Ranked: <span id="rankedCount" class="mono">0</span></div>
    </div>
  </div>

  <!-- Table -->
  <div class="card" id="tableCard">
    <table id="board">
      <thead>
        <tr>
          <th>#</th>
          <th>Driver</th>
          <th>Fastest Lap (s)</th>
          <th>Heat</th>
          <th>Type</th>
          <th>When</th>
          <th>Total Laps</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Visible error/notice area -->
  <div id="notice" class="small"></div>
</main>

<script>
/* ---------- small helpers ---------- */
function fmtSeconds(s) { if (s == null || isNaN(s)) return ""; return Number(s).toFixed(3) + " s"; }
function byNumberAsc(a, b) { if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1; return a - b; }

/* Human-friendly Pacific time, e.g. "March 4th, 2025 12:45 PM" */
function fmtPacificDate(iso) {
  if (!iso) return "";
  try {
    const date = new Date(iso);
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
    }).formatToParts(date);

    let month, day, year, hour, minute, dayPeriod;
    for (const p of parts) {
      if (p.type === "month") month = p.value;
      if (p.type === "day") day = p.value;
      if (p.type === "year") year = p.value;
      if (p.type === "hour") hour = p.value;
      if (p.type === "minute") minute = p.value;
      if (p.type === "dayPeriod") dayPeriod = p.value;
    }
    const dNum = parseInt(day, 10);
    const ord = (dNum % 10 === 1 && dNum !== 11) ? "st"
              : (dNum % 10 === 2 && dNum !== 12) ? "nd"
              : (dNum % 10 === 3 && dNum !== 13) ? "rd"
              : "th";
    return `${month} ${dNum}${ord}, ${year} ${hour}:${minute} ${dayPeriod}`;
  } catch {
    return iso;
  }
}

/* ---------- robust fetch for Pages + local ---------- */
async function jgetRel(name) {
  // Adjust the first entry if your repo name changes
  const candidates = [
    "/PGPTimes/data/" + name,   // GitHub Pages project site
    "../data/" + name,          // local when page is under /frontend
    "./data/" + name,           // if page moves to repo root
  ];
  let lastErr;
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.ok) return res.json();
      lastErr = new Error(`${url} -> HTTP ${res.status}`);
    } catch (e) { lastErr = e; }
  }
  throw lastErr ?? new Error("Failed to fetch " + name);
}

/* ---------- normalize possible JSON shapes ---------- */
function normalizeDriverIndex(raw) {
  if (raw && raw.drivers && typeof raw.drivers === "object") return raw;
  const alt = (raw && (raw.by_name || raw.index));
  if (alt && typeof alt === "object") return { drivers: alt, last_updated_utc: raw.last_updated_utc || "" };
  return { drivers: {}, last_updated_utc: "" };
}
function normalizeWatchlist(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw && Array.isArray(raw.watchlist)) return raw.watchlist;
  if (raw && typeof raw === "object") return Object.keys(raw);
  return [];
}

/* ---------- compute per-driver best WITHIN type filter ---------- */
function bestEntryForDriver(entries, typeFilter) {
  const filtered = (typeFilter && typeFilter !== "All")
    ? entries.filter(e => (e.heat_type || "").toLowerCase().includes(typeFilter.toLowerCase()))
    : entries;

  if (!filtered.length) return null;

  let best = null, bestTime = null;
  for (const e of filtered) {
    const cands = [];
    if (Array.isArray(e.laps) && e.laps.length) cands.push(Math.min(...e.laps));
    if (typeof e.best_lap_seconds === "number") cands.push(e.best_lap_seconds);
    if (!cands.length) continue;

    const minThisHeat = Math.min(...cands);
    if (bestTime == null || minThisHeat < bestTime) {
      bestTime = minThisHeat;
      best = { ...e, fastest_lap_seconds: minThisHeat };
    }
  }
  return best;
}

/* ---------- render ---------- */
function renderTable(rows) {
  const tbody = document.querySelector("#board tbody");
  tbody.innerHTML = "";
  let rank = 0;

  for (const r of rows) {
    const ranked = r.fastest != null;
    if (ranked) rank += 1;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${ranked ? rank : ""}</td>
      <td><a href="./driver_charts.html#${encodeURIComponent(r.name)}">${r.name}</a></td>
      <td>${ranked ? fmtSeconds(r.fastest) : "<span class='small'>— no laps —</span>"}</td>
      <td>${r.heat_no ? `<a href="./index.html#${r.heat_no}">${r.heat_no}</a>` : ""}</td>
      <td>${r.heat_type || ""}</td>
      <td class="small">${fmtPacificDate(r.when)}</td>
      <td>${r.laps_count || ""}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById("rankedCount").textContent = rows.filter(r => r.fastest != null).length;
}

/* ---------- global state (data loaded once) ---------- */
let G = {
  watchlist: [],
  byName: {},          // driver_index.drivers
  lastUpdated: "",
  rowsAllType: [],     // cache not used now (we recompute per type)
};

/* ---------- build rows for a given filter ---------- */
function buildRowsFor(typeFilter, nameQuery) {
  const q = (nameQuery || "").trim().toLowerCase();
  const names = G.watchlist.filter(n => !q || (n || "").toLowerCase().includes(q));

  const rows = [];
  for (const name of names) {
    const series = G.byName[name] || [];
  
    // apply the same heat type filter used for "best"
    const filteredSeries = (typeFilter && typeFilter !== "All")
      ? series.filter(e => (e.heat_type || "").toLowerCase().includes(typeFilter.toLowerCase()))
      : series;
  
    // total laps across all filtered heats
    const totalLaps = filteredSeries.reduce((sum, e) => {
      const n = Array.isArray(e.laps) ? e.laps.length : 0;
      return sum + n;
    }, 0);
  
    const best = bestEntryForDriver(series, typeFilter);
  
    if (best && typeof best.fastest_lap_seconds === "number") {
      rows.push({
        name,
        fastest: best.fastest_lap_seconds,
        heat_no: best.heat_no ?? "",
        heat_type: best.heat_type ?? "",
        when: best.start_time_iso ?? "",
        laps_count: totalLaps || ""  // <-- total laps, not laps from best heat
      });
    } else {
      rows.push({ name, fastest: null, heat_no: "", heat_type: "", when: "", laps_count: totalLaps || "" });
    }
  }

  rows.sort((a, b) => {
    const cmp = byNumberAsc(a.fastest, b.fastest);
    if (cmp !== 0) return cmp;
    return (a.name || "").localeCompare(b.name || "");
  });

  return rows;
}

/* ---------- load & wire ---------- */
async function loadAll() {
  const notice = document.getElementById("notice");

  // Safe handler for optional refresh link
  const refreshEl = document.getElementById("refreshBtn");
  if (refreshEl) {
    refreshEl.onclick = (e) => { e?.preventDefault?.(); location.reload(); };
  }

  let driverIndexRaw, watchlistRaw;
  try {
    [driverIndexRaw, watchlistRaw] = await Promise.all([
      jgetRel("driver_index.json"),
      jgetRel("drivers_watchlist.json"),
    ]);
  } catch (err) {
    notice.textContent = "Failed to load data files. " + (err?.message || err);
    return;
  }

  const driverIndex = normalizeDriverIndex(driverIndexRaw);
  const watchlist   = normalizeWatchlist(watchlistRaw);

  // Store globally for recompute on filter change
  G.watchlist = watchlist;
  G.byName = driverIndex.drivers || {};
  G.lastUpdated = driverIndex.last_updated_utc || "";

  document.getElementById("updated").textContent = G.lastUpdated;
  document.getElementById("watchCount").textContent = G.watchlist.length;

  const typeSelect = document.getElementById("heatTypeSelect");
  const filterInput = document.getElementById("filterInput");

  function recomputeAndRender() {
    const typeFilter = typeSelect ? typeSelect.value : "All";
    const q = filterInput ? filterInput.value : "";
    const rows = buildRowsFor(typeFilter, q);
    renderTable(rows);
  }

  // Initial render
  recomputeAndRender();

  // Live filters
  if (typeSelect && !typeSelect._wired) {
    typeSelect.addEventListener("change", recomputeAndRender);
    typeSelect._wired = true;
  }
  if (filterInput && !filterInput._wired) {
    filterInput.addEventListener("input", recomputeAndRender);
    filterInput._wired = true;
  }
}

loadAll().catch(err => {
  const n = document.getElementById("notice");
  n.textContent = "Error: " + (err?.message || err);
});
</script>

<style>
/* Make table links match text, underline on hover */
table a { color: inherit; text-decoration: none; }
table a:hover { text-decoration: underline; }
</style>
</body>
</html>
