<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Endurance Races</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./style.css"/>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1>Endurance Races</h1>
</header>
<main>
  <!-- Controls / status -->
  <div class="card">
    <div class="row" style="gap:8px; flex-wrap:wrap;">
      <a class="badge" href="./index.html">← Heats Browser</a>
      <a class="badge" href="./drivers_leaderboard.html">Leaderboard →</a>
      <a class="badge" href="./drivers.html">Watchlist →</a>
      <span class="small">Updated: <span id="updated" class="mono"></span></span>
      <span class="small">Total: <span id="count" class="mono">0</span></span>
      <span class="small">Selected heat: <span id="selectedHeat" class="mono">—</span></span>
    </div>
    <div class="small" id="status" style="margin-top:6px;">Loading…</div>
  </div>

  <!-- Gap from leader chart -->
  <div class="card">
    <div class="row" style="justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap;">
      <div><strong>Gap from Leader by Lap</strong> <span id="chartSubtitle" class="small mono"></span></div>
    </div>
    <canvas id="gapChart" height="140"></canvas>
  </div>

  <!-- Endurance table -->
  <div class="card">
    <table id="endTable">
      <thead>
        <tr>
          <th>Race</th>
          <th>First</th>
          <th>Second</th>
          <th>Third</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="notice" class="small"></div>
</main>

<script>
/* -------------------- robust fetch helpers -------------------- */
async function jget(paths) {
  let lastErr;
  for (const p of paths) {
    try {
      const r = await fetch(p, { cache: "no-store" });
      if (r.ok) return r.json();
      lastErr = new Error(`${p} -> ${r.status}`);
    } catch (e) { lastErr = e; }
  }
  throw lastErr ?? new Error("fetch failed");
}
function loadIndex() {
  return jget([
    "/PGPTimes/data/endurance_index.json",
    "../data/endurance_index.json",
    "./data/endurance_index.json"
  ]);
}
function loadHeat(n) {
  const file = String(n) + ".json";
  return jget([
    "/PGPTimes/data/heats/" + file,
    "../data/heats/" + file,
    "./data/heats/" + file
  ]);
}

/* -------------------- UI helpers -------------------- */
function renderTable(rows, onPickHeat) {
  const tbody = document.querySelector("#endTable tbody");
  tbody.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><a href="./index.html#${r.heat_no}" data-heat="${r.heat_no}">${r.heat_no}</a></td>
      <td>${r.first || ""}</td>
      <td>${r.second || ""}</td>
      <td>${r.third || ""}</td>
    `;
    // intercept click to update chart without navigating away
    const a = tr.querySelector("a[data-heat]");
    a.addEventListener("click", (ev) => {
      ev.preventDefault();
      const heat = parseInt(a.getAttribute("data-heat"), 10);
      if (onPickHeat) onPickHeat(heat);
    });
    tbody.appendChild(tr);
  }
}

/* -------------------- charting: gap from leader -------------------- */
let gapChart = null;

function niceSeconds(s) {
  if (s == null || isNaN(s)) return "";
  return Number(s).toFixed(3) + " s";
}

// generate a set of distinct, readable colors
function colorForIndex(i) {
  const palette = [
    "#36A2EB","#FF6384","#4BC0C0","#FF9F40","#9966FF",
    "#FFCD56","#2ecc71","#e67e22","#1abc9c","#c0392b",
    "#8e44ad","#16a085","#2c3e50","#d35400","#7f8c8d"
  ];
  return palette[i % palette.length];
}

function buildGapSeriesFromHeat(heat) {
  // Build cumulative times per driver; some drivers may have different lap counts
  const drivers = Array.isArray(heat.drivers) ? heat.drivers.slice() : [];
  // require arrays of laps with at least 1 entry
  const series = drivers
    .filter(d => Array.isArray(d.laps) && d.laps.length > 0 && typeof d.name === "string")
    .map(d => {
      const cum = [];
      let sum = 0;
      for (const t of d.laps) {
        const v = Number(t);
        if (isNaN(v)) { cum.push(sum); continue; }
        sum += v;
        cum.push(sum);
      }
      return { name: d.name, cumulative: cum };
    });

  if (!series.length) return { labels: [], datasets: [] };

  // Determine max lap length across drivers
  const maxLaps = Math.max(...series.map(s => s.cumulative.length));
  const labels = Array.from({length: maxLaps}, (_,i) => i+1);

  // For each lap i, determine the minimum cumulative among drivers who have lap i
  const leaderCum = labels.map((_, i) => {
    let minVal = Infinity;
    for (const s of series) {
      if (s.cumulative.length > i) {
        const val = s.cumulative[i];
        if (val < minVal) minVal = val;
      }
    }
    return isFinite(minVal) ? minVal : null;
  });

  // Build gap series per driver
  const datasets = series.map((s, idx) => {
    const data = s.cumulative.map((v, i) => {
      const base = leaderCum[i];
      return (base == null) ? null : v - base;
    });
    return {
      label: s.name,
      data,
      borderColor: colorForIndex(idx),
      backgroundColor: colorForIndex(idx),
      showLine: true,
      type: "line",
      pointRadius: 0,
      borderWidth: 2,
      tension: 0.15,
      spanGaps: true  // if leaderCum[i] is null for some tail laps
    };
  });

  return { labels, datasets };
}

function renderGapChart(heat) {
  const ctx = document.getElementById("gapChart").getContext("2d");
  const { labels, datasets } = buildGapSeriesFromHeat(heat);

  if (gapChart) gapChart.destroy();
  gapChart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      scales: {
        x: {
          title: { display: true, text: "Lap Index" },
          ticks: { autoSkip: true }
        },
        y: {
          title: { display: true, text: "Gap from Leader (s)" }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const name = ctx.dataset?.label || "";
              const val = ctx.parsed?.y;
              return `${name}: ${niceSeconds(val)}`;
            }
          }
        },
        legend: { display: true }
      }
    }
  });

  // Update subtitle + selected heat label
  const sub = document.getElementById("chartSubtitle");
  const pick = document.getElementById("selectedHeat");
  sub.textContent = heat.start_time_iso ? `• ${heat.heat_type || ""} • ${heat.start_time_iso}` : (heat.heat_type || "");
  pick.textContent = heat.heat_no ?? "";
}

/* -------------------- page bootstrap -------------------- */
(async () => {
  const status = document.getElementById("status");
  const notice = document.getElementById("notice");

  try {
    const idx = await loadIndex();
    document.getElementById("updated").textContent = idx.last_updated_utc || "";
    document.getElementById("count").textContent = idx.count ?? (idx.rows?.length || 0);

    const rows = Array.isArray(idx.rows) ? idx.rows.slice() : [];
    // Ensure newest first (endurance_index.json should already be sorted)
    rows.sort((a,b) => {
      const ta = a.start_time_iso || "", tb = b.start_time_iso || "";
      if (ta && tb && ta !== tb) return tb.localeCompare(ta);
      return (b.heat_no || 0) - (a.heat_no || 0);
    });

    // Render table (with click handler that updates the chart)
    renderTable(rows, async (heatNo) => {
      status.textContent = `Loading heat ${heatNo}…`;
      try {
        const heat = await loadHeat(heatNo);
        renderGapChart(heat);
        status.textContent = `Loaded heat ${heatNo}.`;
      } catch (e) {
        notice.textContent = "Failed to load heat " + heatNo + ": " + (e?.message || e);
      }
    });

    // Auto-load the most recent endurance heat to draw the chart
    if (rows.length) {
      const firstHeatNo = rows[0].heat_no;
      status.textContent = `Loading heat ${firstHeatNo}…`;
      try {
        const heat = await loadHeat(firstHeatNo);
        renderGapChart(heat);
        status.textContent = `Loaded heat ${firstHeatNo}.`;
      } catch (e) {
        notice.textContent = "Failed to load initial heat: " + (e?.message || e);
      }
    } else {
      status.textContent = "No endurance races found.";
    }

  } catch (e) {
    notice.textContent = "Failed to load endurance_index.json: " + (e?.message || e);
    status.textContent = "Error.";
  }
})();
</script>

<style>
table a { color: inherit; text-decoration: none; }
table a:hover { text-decoration: underline; }
</style>
</body>
</html>
